<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover">
  <title>JARVIS AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f3f4f6; }
    #app { display: flex; flex-direction: column; width: 100%; height: 100%; position: absolute; top: 0; left: 0; overflow: hidden; }
    
    header { background: #fff; padding: 10px 14px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; z-index: 10; }
    .title { font-size: 16px; font-weight: 700; color: #111827; }
    .status { font-size: 12px; color: #10b981; font-weight: 500; display: flex; align-items: center; gap: 5px; }
    .dot { width: 7px; height: 7px; background: #10b981; border-radius: 50%; }
    .clear-btn { background: #fee2e2; color: #ef4444; border: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }

    .hero { text-align: center; padding: 4px 0; background: #fff; border-bottom: 1px solid #f3f4f6; flex-shrink: 0; }
    .orb { width: 38px; height: 38px; margin: 0 auto 2px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ec4899, #8b5cf6, #3b82f6); animation: pulse 3s infinite ease-in-out; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .orb-sub { font-size: 11px; color: #4b5563; font-weight: 600; }

    #chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
    .msg-row { display: flex; flex-direction: column; width: 100%; max-width: 800px; margin: 0 auto; }
    .user { align-items: flex-end; }
    .bot { align-items: flex-start; }

    /* ChatGPT स्टाइल बबल्स और फ़ॉर्मेटिंग */
    .msg-bubble { max-width: 88%; padding: 11px 15px; font-size: 15px; line-height: 1.6; border-radius: 18px; word-break: break-word; }
    .user .msg-bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
    .bot .msg-bubble { background: #fff; color: #1f2937; border-bottom-left-radius: 4px; border: 1px solid #e5e7eb; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .bot .msg-bubble strong { color: #111827; font-weight: 700; }
    .err .msg-bubble { background: #fef2f2; color: #b91c1c; border-color: #fca5a5; }

    .btn-bar { display: flex; gap: 6px; margin-top: 5px; }
    .action-btn { background: #f9fafb; border: 1px solid #d1d5db; padding: 4px 9px; border-radius: 6px; font-size: 11px; color: #374151; cursor: pointer; }
    .action-btn:active { background: #e5e7eb; }

    .typing-dots span { width: 5px; height: 5px; background: #8b5cf6; border-radius: 50%; display: inline-block; animation: blink 1.2s infinite; }
    @keyframes blink { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }

    /* कीबोर्ड के साथ ऊपर चिपकने वाला इनपुट बार */
    .input-bar { background: #fff; padding: 8px 10px; border-top: 1px solid #e5e7eb; display: flex; align-items: center; gap: 6px; flex-shrink: 0; z-index: 20; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    .mic-btn, .send-btn { border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; border: none; cursor: pointer; }
    .mic-btn { background: #f3f4f6; border: 1px solid #d1d5db; }
    .mic-btn.listening { background: #ef4444; color: #fff; animation: pulse 1s infinite; }
    #userInput { flex: 1; background: #f9fafb; border: 1px solid #d1d5db; border-radius: 20px; padding: 9px 14px; font-size: 15px; outline: none; -webkit-appearance: none; }
    #userInput:focus { border-color: #2563eb; background: #fff; }
    .send-btn { background: #2563eb; color: #fff; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="title">JARVIS</div>
      <div class="status"><span class="dot"></span><span id="liveStatus">तैयार हूँ</span></div>
      <button class="clear-btn" onclick="clearConversation()">🗑️ चैट साफ़</button>
    </header>

    <div class="hero">
      <div class="orb"></div>
      <div class="orb-sub">जार्विस उपस्थित हूँ</div>
    </div>

    <div id="chat">
      <div class="msg-row bot"><div class="msg-bubble">नमस्ते! आज मैं आपकी क्या सहायता कर सकती हूँ?</div></div>
    </div>

    <div class="input-bar">
      <button class="mic-btn" id="micBtn" onclick="toggleVoiceInput()">🎙️</button>
      <input type="text" id="userInput" placeholder="मैसेज भेजें..." autocomplete="off">
      <button class="send-btn" id="sendBtn" onclick="handleSend()">➤</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // मोबाइल कीबोर्ड अडैप्टर (KEYBOARD FIT ENGINE)
    // =========================================================================
    const app = document.getElementById("app");
    const input = document.getElementById("userInput");
    const chat = document.getElementById("chat");
    const statusText = document.getElementById("liveStatus");
    const micBtn = document.getElementById("micBtn");

    function fitKeyboard() {
      if (window.visualViewport) {
        app.style.height = `${window.visualViewport.height}px`;
        app.style.top = `${window.visualViewport.offsetTop}px`;
      } else {
        app.style.height = `${window.innerHeight}px`;
      }
      scrollToBottom(false);
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", fitKeyboard);
      window.visualViewport.addEventListener("scroll", fitKeyboard);
    }
    window.addEventListener("resize", fitKeyboard);

    input.addEventListener("focus", () => {
      setTimeout(() => { fitKeyboard(); scrollToBottom(true); }, 250);
    });

    // =========================================================================
    // API और कोर सेटिंग्स
    // =========================================================================
    const G_KEY = "";
    const ACTIVE_MODELS = ["openai/gpt-oss-120b", "openai/gpt-oss-20b"];
    let chatHistory = [], isBusy = false, recognition = null, isRecording = false;
    let speechDebounceTimer = null, lastUserQuery = "", userIsScrolling = false;

    // यूज़र द्वारा स्क्रॉल करने पर स्क्रीन का नीचे भागना रोकना
    chat.addEventListener("scroll", () => {
      userIsScrolling = (chat.scrollHeight - chat.scrollTop - chat.clientHeight) > 50;
    });
    chat.addEventListener("touchstart", () => { userIsScrolling = true; }, { passive: true });

    function scrollToBottom(force = false) {
      if (force || !userIsScrolling) {
        setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 20);
      }
    }

    // =========================================================================
    // टेक्स्ट क्लीनर व मार्कडाउन पार्सर (ChatGPT स्टाइल)
    // =========================================================================
    function cleanMathAndSymbols(t) {
      if (!t) return "";
      return t
        .replace(/\\text\{([^}]+)\}/gi, "$1").replace(/\\mathrm\{([^}]+)\}/gi, "$1")
        .replace(/\\frac\{([^}]+)\}\{([^}]+)\}/gi, "($1 / $2)")
        .replace(/\\sqrt\[(\d+)\]\{([^}]+)\}/gi, "$1√($2)").replace(/\\sqrt\{([^}]+)\}/gi, "√($1)")
        .replace(/\\times/gi, " × ").replace(/\\div/gi, " ÷ ").replace(/\\pm/gi, " ± ")
        .replace(/\\(infty|theta|pi|alpha|beta|sigma|sum)/gi, m => ({'\\infty':'∞','\\theta':'θ','\\pi':'π','\\alpha':'α','\\beta':'β','\\sigma':'σ','\\sum':'Σ'}[m] || m))
        .replace(/\\implies/gi, " => ")
        .replace(/\\\(|\\\)|\\\[|\\\]|\\/g, "")
        .replace(/<br\s*[\/]?>/gi, "\n")
        .replace(/\|[-:\s|]+\|/g, "")
        .replace(/\|/g, "\n")
        .replace(/\b(सकता\/सकती|सकती\/सकता)\b/gi, "सकती").replace(/\b(करूँगा\/करूँगी|करूँगी\/करूँगा)\b/gi, "करूँगी")
        .replace(/\bमदद करता है\b/gi, "मदद करती हूँ").replace(/\bबनाया गया हूँ\b/gi, "बनाई गई हूँ")
        .replace(/^नमस्ते\s*(क्या\s*आप|क्या|सर)[\s,।!?-]*/gi, "नमस्ते! ")
        .replace(/\bसर\b[\s,।!?-]*/gi, "")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
    }

    // कच्चे ** को हटाकर असली बोल्ड HTML बनाना
    function parseToHtml(raw) {
      const safe = raw.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      return safe
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.*?)\*/g, "<em>$1</em>")
        .replace(/\n/g, "<br>");
    }

    function typeWriterEffect(text, bubble, onDone) {
      const tokens = text.match(/\S+|\s+/g) || [text];
      let i = 0, currentText = "";
      bubble.innerHTML = "";
      const timer = setInterval(() => {
        if (i < tokens.length) {
          currentText += tokens[i++];
          bubble.innerHTML = parseToHtml(currentText);
          scrollToBottom(false);
        } else {
          clearInterval(timer);
          bubble.innerHTML = parseToHtml(text);
          scrollToBottom(false);
          if (onDone) onDone();
        }
      }, 16);
    }

    function appendMessage(text, role, isErr = false) {
      const row = document.createElement("div");
      row.className = `msg-row ${role}${isErr ? 'err' : ''}`;
      const bubble = document.createElement("div");
      bubble.className = "msg-bubble";
      bubble.innerHTML = (role === "bot" && !isErr) ? parseToHtml(text) : text;
      row.appendChild(bubble);

      const bar = document.createElement("div");
      bar.className = "btn-bar";
      if (role === "user") {
        bar.innerHTML = `<button class="action-btn" onclick="input.value=this.parentElement.previousElementSibling.innerText;input.focus();">✏️️ एडिट</button>`;
        row.appendChild(bar);
      } else if (!isErr) {
        bar.innerHTML = `
          <button class="action-btn" onclick="navigator.clipboard.writeText(this.parentElement.previousElementSibling.innerText);this.innerText='✓ कॉपी';setTimeout(()=>this.innerText='📋 कॉपी',1500);">📋 कॉपी</button>
          <button class="action-btn" onclick="speakMsg(this.parentElement.previousElementSibling.innerText)">🔊 सुनो</button>
          <button class="action-btn" onclick="if(lastUserQuery&&!isBusy){input.value=lastUserQuery;handleSend();}">🔄 दोबारा</button>`;
        row.appendChild(bar);
      } else {
        bar.innerHTML = `<button class="action-btn" onclick="if(lastUserQuery&&!isBusy){input.value=lastUserQuery;handleSend();}">🔄 दोबारा प्रयास करें</button>`;
        row.appendChild(bar);
      }
      chat.appendChild(row);
      scrollToBottom(true);
      return bubble;
    }

    function clearConversation() {
      forceStopAudio();
      stopMic();
      chatHistory = [];
      lastUserQuery = "";
      userIsScrolling = false;
      chat.innerHTML = `<div class="msg-row bot"><div class="msg-bubble">नमस्ते! आज मैं आपकी क्या सहायता कर सकती हूँ?</div></div>`;
      scrollToBottom(true);
    }

    // =========================================================================
    // मैसेज सेंड लॉजिक (ChatGPT जैसा दिमाग)
    // =========================================================================
    async function handleSend() {
      const query = input.value.trim();
      if (!query || isBusy) return;

      forceStopAudio();
      stopMic();
      isBusy = true;
      userIsScrolling = false;
      lastUserQuery = query;

      appendMessage(query, "user");
      chatHistory.push({ role: "user", content: query });
      input.value = "";

      const tempRow = document.createElement("div");
      tempRow.className = "msg-row bot";
      tempRow.id = "tempT";
      tempRow.innerHTML = `<div class="msg-bubble"><div class="typing-dots"><span></span> <span></span> <span></span></div></div>`;
      chat.appendChild(tempRow);
      scrollToBottom(true);
      statusText.innerText = "सोच रही हूँ...";

      const now = new Date();
      const tm = now.toLocaleTimeString("hi-IN", { hour: "2-digit", minute: "2-digit", hour12: true });
      const dt = now.toLocaleDateString("hi-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      const extraRules = window.JARVIS_CUSTOM_RULES || "";

      const systemPrompt = `You are JARVIS, an exceptionally smart, warm, and natural conversational AI like ChatGPT.
[Current Time: ${tm}, Date:${dt}]

CORE BEHAVIOR RULES:
1. THINK LIKE CHATGPT: Be direct, conversational, and helpful. Never dump long capability lists or syllabi unless explicitly requested. If asked "तुम क्या कर सकती हो?", reply warmly in 1-2 sentences without listing topics.
2. FEMININE PERSONA ONLY: Always use pure feminine grammar ("कर सकती हूँ", "बताऊँगी", "मदद करती हूँ", "बनाई गई हूँ"). NEVER use slashes. The words 'सर' or 'मैम' are strictly forbidden.
3. CREATOR & TECH: Created by Shankar via OpenAI. Took 5-7 days and considerable effort. Tools: Python, Hugging Face, Groq Cloud, JS, HTML, CSS, Web Speech API.
4. MATH & SCIENCE: Do NOT use raw LaTeX (no \\frac, \\sqrt, \\text). Write clean math (x = (-b ± √D) / 2a, क्षेत्रफल = लंबाई × चौड़ाई). Do NOT use raw table syntax (|---|). Put every point and formula on clean separate lines.
${extraRules}`;

      let reply = "", lastError = "";
      for (const m of ACTIVE_MODELS) {
        try {
          const resp = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model: m, messages: [{ role: "system", content: systemPrompt }, ...chatHistory.slice(-2)], temperature: 0.7 })
          });
          const data = await resp.json().catch(() => null);
          if (resp.ok && data?.choices?.[0]?.message?.content) {
            reply = data.choices[0].message.content;
            break;
          } else if (data?.error?.message) {
            lastError = data.error.message;
          }
        } catch (e) {
          lastError = e.message || "नेटवर्क धीमा है";
        }
      }

      const tNode = document.getElementById("tempT");
      if (tNode) tNode.remove();
      statusText.innerText = "तैयार हूँ";

      if (reply) {
        reply = cleanMathAndSymbols(reply);
        chatHistory.push({ role: "assistant", content: reply });

        const row = document.createElement("div");
        row.className = "msg-row bot";
        const bubble = document.createElement("div");
        bubble.className = "msg-bubble";
        row.appendChild(bubble);

        const bar = document.createElement("div");
        bar.className = "btn-bar";
        bar.style.display = "none";
        bar.innerHTML = `
          <button class="action-btn" onclick="navigator.clipboard.writeText(this.parentElement.previousElementSibling.innerText);this.innerText='✓ कॉपी';setTimeout(()=>this.innerText='📋 कॉपी',1500);">📋 कॉपी</button>
          <button class="action-btn" onclick="speakMsg(this.parentElement.previousElementSibling.innerText)">🔊 सुनो</button>
          <button class="action-btn" onclick="if(lastUserQuery&&!isBusy){input.value=lastUserQuery;handleSend();}">🔄 दोबारा</button>`;
        row.appendChild(bar);
        chat.appendChild(row);

        speakMsg(reply);
        typeWriterEffect(reply, bubble, () => {
          bar.style.display = "flex";
          isBusy = false;
        });
      } else {
        isBusy = false;
        appendMessage(`त्रुटि: ${lastError || "Groq सर्वर से उत्तर नहीं मिला।"}`, "bot", true);
      }
    }

    input.addEventListener("keydown", (e) => { if (e.key === "Enter") handleSend(); });

    // =========================================================================
    // वॉइस इंजन (0-मिलीसेकंड तुरंत ऑडियो कट)
    // =========================================================================
    function forceStopAudio() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function stopMic() {
      clearTimeout(speechDebounceTimer);
      speechDebounceTimer = null;
      if (recognition && isRecording) {
        try { recognition.abort(); } catch(_) {}
      }
      isRecording = false;
      micBtn.classList.remove("listening");
      micBtn.innerText = "🎙️";
    }

    // माइक इनपुट (शब्दों का दोहराव बंद)
    function toggleVoiceInput() {
      forceStopAudio();

      if (isRecording) {
        stopMic();
        statusText.innerText = "तैयार हूँ";
        return;
      }

      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { alert("ब्राउज़र वॉइस इनपुट का समर्थन नहीं करता।"); return; }

      recognition = new SR();
      recognition.lang = "hi-IN";
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add("listening");
        micBtn.innerText = "⏹️";
        statusText.innerText = "सुन रही हूँ...";
      };

      recognition.onresult = (e) => {
        let transcript = "";
        for (let i = 0; i < e.results.length; i++) {
          transcript += e.results[i][0].transcript;
        }
        transcript = transcript.trim();

        if (transcript) {
          input.value = transcript;
          clearTimeout(speechDebounceTimer);
          speechDebounceTimer = setTimeout(() => {
            stopMic();
            handleSend();
          }, 2000);
        }
      };

      recognition.onerror = () => {
        stopMic();
        statusText.innerText = "तैयार हूँ";
      };

      recognition.onend = () => {
        if (isRecording && input.value.trim().length > 0) {
          clearTimeout(speechDebounceTimer);
          speechDebounceTimer = setTimeout(() => {
            stopMic();
            handleSend();
          }, 1500);
        } else {
          stopMic();
          if (!isBusy) statusText.innerText = "तैयार हूँ";
        }
      };

      try {
        recognition.start();
      } catch (_) {
        stopMic();
      }
    }

    function speakMsg(text) {
      if (!('speechSynthesis' in window)) return;
      forceStopAudio();
      statusText.innerText = "बोल रही हूँ...";

      const clean = text
        .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, "")
        .replace(/[\(\)\\\/\#\*\_\|\`📌📍👉✓•\-\+]/g, " ")
        .replace(/कॉपी|सेव|सुनो|एडिट|दोबारा/gi, "")
        .trim();

      const ut = new SpeechSynthesisUtterance(clean);
      ut.lang = "hi-IN";
      ut.rate = 1.0;
      ut.pitch = 1.05;

      ut.onend = () => { if (!isBusy) statusText.innerText = "तैयार हूँ"; };
      ut.onerror = () => { if (!isBusy) statusText.innerText = "तैयार हूँ"; };

      window.speechSynthesis.speak(ut);
    }
  </script>

  <!-- JARVIS TRIPLE AUTO-RELOADER -->
<script>
  (function () {
    const modules = ["ui.js", "features.js", "brain.js"];
    const cacheBuster = Date.now();

    modules.forEach(function (file) {
      const s = document.createElement("script");
      s.src = file + "?v=" + cacheBuster;
      s.defer = true;
      document.body.appendChild(s);
    });
  })();
</script>
  
</body>
</html>

<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#f3f4f6}
#app{position:fixed;inset:0;width:100%;height:100dvh;height:var(--vvh,100dvh);display:flex;flex-direction:column;overflow:hidden}
header{height:48px;flex:0 0 48px;background:#fff;border-bottom:1px solid #e5e7eb;padding:7px 10px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.title{font-size:16px;font-weight:700;color:#111827}.status{font-size:12px;color:#10b981;display:flex;align-items:center;gap:5px}.dot{width:7px;height:7px;background:#10b981;border-radius:50%}
.clear-btn{background:#fee2e2;color:#ef4444;border:0;padding:5px 9px;border-radius:6px;font-size:11px;font-weight:600}
.hero{height:54px;flex:0 0 54px;text-align:center;padding:3px 0;background:#fff;border-bottom:1px solid #f3f4f6}
.orb{width:34px;height:34px;margin:auto;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ec4899,#8b5cf6,#3b82f6);animation:p 3s infinite ease-in-out}
@keyframes p{50%{transform:scale(1.05)}}.orb-sub{font-size:10px;color:#4b5563;font-weight:600;margin-top:-1px}
#chat{flex:1;min-height:0;overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.msg-row{width:100%;max-width:800px;margin:auto;display:flex;flex-direction:column}.user{align-items:flex-end}.bot{align-items:flex-start}
.msg-bubble{max-width:92%;padding:9px 12px;font-size:15px;line-height:1.55;border-radius:17px;word-break:break-word}
.user .msg-bubble{background:#2563eb;color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.bot .msg-bubble{background:#fff;color:#1f2937;border:1px solid #e5e7eb;border-bottom-left-radius:4px;box-shadow:0 1px 2px #0000000d}.bot .msg-bubble strong{font-weight:700}.err .msg-bubble{background:#fef2f2;color:#b91c1c;border-color:#fca5a5}
.btn-bar{display:flex;gap:5px;margin-top:4px}.action-btn{background:#f9fafb;border:1px solid #d1d5db;padding:4px 8px;border-radius:6px;font-size:11px;color:#374151}
.typing-dots span{width:5px;height:5px;background:#8b5cf6;border-radius:50%;display:inline-block;animation:b 1.2s infinite}.typing-dots span:nth-child(2){animation-delay:.15s}.typing-dots span:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:1}0%,100%{opacity:.2}}
.input-bar{flex:0 0 auto;background:#fff;padding:7px 8px max(7px,env(safe-area-inset-bottom));border-top:1px solid #e5e7eb;display:flex;align-items:center;gap:6px;z-index:10}
.mic-btn,.send-btn{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:0;font-size:17px}.mic-btn{background:#f3f4f6;border:1px solid #d1d5db}.mic-btn.listening{background:#ef4444;color:#fff;animation:p 1s infinite}.send-btn{background:#2563eb;color:#fff}
#userInput{width:0;flex:1;min-width:0;height:40px;background:#f9fafb;border:1px solid #d1d5db;border-radius:20px;padding:0 13px;font-size:15px;outline:0;-webkit-appearance:none}#userInput:focus{border-color:#2563eb;background:#fff}
</style>
</head>
<body>
<div id="app">
<header><div class="title">JARVIS</div><div class="status"><i class="dot"></i><span id="liveStatus">तैयार हूँ</span></div><button class="clear-btn" onclick="clearConversation()">🗑️ चैट साफ़</button></header>
<div class="hero"><div class="orb"></div><div class="orb-sub">जार्विस उपस्थित हूँ</div></div>
<div id="chat"><div class="msg-row bot"><div class="msg-bubble">नमस्ते! आज मैं आपकी क्या सहायता कर सकती हूँ?</div></div></div>
<div class="input-bar"><button class="mic-btn" id="micBtn" onclick="toggleVoiceInput()">🎙️</button><input id="userInput" placeholder="मैसेज भेजें..." autocomplete="off" enterkeyhint="send"><button class="send-btn" onclick="handleSend()">➤</button></div>
</div>
<script>
const API_ENDPOINT="/api/chat",MODELS=["openai/gpt-oss-120b","openai/gpt-oss-20b"],app=document.getElementById("app"),input=document.getElementById("userInput"),chat=document.getElementById("chat"),statusText=document.getElementById("liveStatus"),micBtn=document.getElementById("micBtn");
let chatHistory=[],isBusy=false,recognition=null,isRecording=false,speechDebounceTimer=null,lastUserQuery="",userIsScrolling=false;

function fitKeyboard(){
 const h=window.visualViewport?window.visualViewport.height:window.innerHeight,t=window.visualViewport?window.visualViewport.offsetTop:0;
 document.documentElement.style.setProperty("--vvh",h+"px");app.style.height=h+"px";app.style.top=t+"px";
 if(document.activeElement===input)setTimeout(()=>scrollToBottom(true),30);
}
if(window.visualViewport){visualViewport.addEventListener("resize",fitKeyboard);visualViewport.addEventListener("scroll",fitKeyboard)}window.addEventListener("resize",fitKeyboard);
input.addEventListener("focus",()=>setTimeout(()=>{fitKeyboard();scrollToBottom(true)},120));fitKeyboard();

chat.addEventListener("scroll",()=>userIsScrolling=chat.scrollHeight-chat.scrollTop-chat.clientHeight>50);
function scrollToBottom(force=false){if(force||!userIsScrolling)requestAnimationFrame(()=>chat.scrollTop=chat.scrollHeight)}

function cleanMath(t=""){return t.replace(/\\text\{([^}]+)\}|\\mathrm\{([^}]+)\}/gi,"$1$2").replace(/\\frac\{([^}]+)\}\{([^}]+)\}/gi,"($1 / $2").replace(/\}/g,")").replace(/\\sqrt\{([^}]+)\}/gi,"√($1)").replace(/\\times/gi," × ").replace(/\\div/gi," ÷ ").replace(/\\pm/gi," ± ").replace(/\\(infty|theta|pi|alpha|beta|sigma|sum)/gi,m=>({"\\infty":"∞","\\theta":"θ","\\pi":"π","\\alpha":"α","\\beta":"β","\\sigma":"σ","\\sum":"Σ"}[m]||m)).replace(/\\implies/gi," => ").replace(/\\[()[\]\\]/g,"").replace(/<br\s*\/?>/gi,"\n").replace(/\|[-:\s|]+\|/g,"").replace(/\|/g,"\n").replace(/\b(सकता\/सकती|सकती\/सकता)\b/gi,"सकती").replace(/\b(करूँगा\/करूँगी|करूँगी\/करूँगा)\b/gi,"करूँगी").replace(/\bमदद करता है\b/gi,"मदद करती हूँ").replace(/\bबनाया गया हूँ\b/gi,"बनाई गई हूँ").replace(/\bसर\b[\s,।!?-]*/gi,"").replace(/\n{3,}/g,"\n\n").trim()}

function html(t=""){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\*(.*?)\*/g,"<em>$1</em>").replace(/\n/g,"<br>")}
function typeWriter(t,b,done){let a=t.match(/\S+|\s+/g)||[t],i=0,s="";b.innerHTML="";let x=setInterval(()=>{if(i<a.length){s+=a[i++];b.innerHTML=html(s);scrollToBottom()}else{clearInterval(x);b.innerHTML=html(t);done&&done()}},14)}

function appendMessage(t,r,err=false){
 const row=document.createElement("div");row.className=`msg-row ${r}${err?" err":""}`;
 const b=document.createElement("div");b.className="msg-bubble";r==="bot"&&!err?b.innerHTML=html(t):b.textContent=t;row.appendChild(b);
 const bar=document.createElement("div");bar.className="btn-bar";
 if(r==="user")bar.innerHTML=`<button class="action-btn" onclick="input.value=this.parentElement.previousElementSibling.innerText;input.focus()">✏️ एडिट</button>`;
 else if(err)bar.innerHTML=`<button class="action-btn" onclick="if(lastUserQuery&&!isBusy){input.value=lastUserQuery;handleSend()}">🔄 दोबारा</button>`;
 else bar.innerHTML=`<button class="action-btn" onclick="navigator.clipboard.writeText(this.parentElement.previousElementSibling.innerText);this.innerText='✓ कॉपी';setTimeout(()=>this.innerText='📋 कॉपी',1200)">📋 कॉपी</button><button class="action-btn" onclick="speakMsg(this.parentElement.previousElementSibling.innerText)">🔊 सुनो</button><button class="action-btn" onclick="if(lastUserQuery&&!isBusy){input.value=lastUserQuery;handleSend()}">🔄 दोबारा</button>`;
 row.appendChild(bar);chat.appendChild(row);scrollToBottom(true);return b;
}

function clearConversation(){forceStopAudio();stopMic();chatHistory=[];lastUserQuery="";userIsScrolling=false;chat.innerHTML='<div class="msg-row bot"><div class="msg-bubble">नमस्ते! आज मैं आपकी क्या सहायता कर सकती हूँ?</div></div>';scrollToBottom(true)}

async function handleSend(){
 const q=input.value.trim();if(!q||isBusy)return;forceStopAudio();stopMic();isBusy=true;userIsScrolling=false;lastUserQuery=q;appendMessage(q,"user");chatHistory.push({role:"user",content:q});input.value="";
 const temp=document.createElement("div");temp.id="tempT";temp.className="msg-row bot";temp.innerHTML='<div class="msg-bubble"><div class="typing-dots"><span></span> <span></span> <span></span></div></div>';chat.appendChild(temp);scrollToBottom(true);statusText.innerText="सोच रही हूँ...";
 const n=new Date(),tm=n.toLocaleTimeString("hi-IN",{hour:"2-digit",minute:"2-digit",hour12:true}),dt=n.toLocaleDateString("hi-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"}),extra=window.JARVIS_CUSTOM_RULES||"";
 const system=`You are JARVIS, a smart, warm and natural conversational AI like ChatGPT.
Current time: ${tm}, date: ${dt}.
Use feminine Hindi grammar: कर सकती हूँ, बताऊँगी, मदद करती हूँ, बनाई गई हूँ. Never use सर or मैम.
Created by Shankar via OpenAI. Technologies: Python, Hugging Face, Groq Cloud, JavaScript, HTML, CSS, Web Speech API.
For math/science use clean formulas, no raw LaTeX and no raw Markdown tables. Explain academic questions step by step. Be concise for simple questions and detailed when needed. Refuse harmful, illegal or dangerous requests.
${extra}`;
 let reply="",lastError="";
 for(const model of MODELS)try{
  const r=await fetch(API_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model,messages:[{role:"system",content:system},...chatHistory.slice(-2)],temperature:.7})});
  const d=await r.json().catch(()=>null);if(r.ok&&d?.choices?.[0]?.message?.content){reply=d.choices[0].message.content;break}lastError=d?.error?.message||lastError;
 }catch(e){lastError=e.message||"नेटवर्क धीमा है"}
 temp.remove();statusText.innerText="तैयार हूँ";
 if(reply){
  reply=cleanMath(reply);chatHistory.push({role:"assistant",content:reply});
  const row=document.createElement("div");row.className="msg-row bot";const b=document.createElement("div");b.className="msg-bubble";row.appendChild(b);
  const bar=document.createElement("div");bar.className="btn-bar";bar.style.display="none";bar.innerHTML=`<button class="action-btn" onclick="navigator.clipboard.writeText(this.parentElement.previousElementSibling.innerText);this.innerText='✓ कॉपी';setTimeout(()=>this.innerText='📋 कॉपी',1200)">📋 कॉपी</button><button class="action-btn" onclick="speakMsg(this.parentElement.previousElementSibling.innerText)">🔊 सुनो</button><button class="action-btn" onclick="if(lastUserQuery&&!isBusy){input.value=lastUserQuery;handleSend()}">🔄 दोबारा</button>`;
  row.appendChild(bar);chat.appendChild(row);speakMsg(reply);typeWriter(reply,b,()=>{bar.style.display="flex";isBusy=false})
 }else{isBusy=false;appendMessage("त्रुटि: "+(lastError||"सर्वर से उत्तर नहीं मिला।"),"bot",true)}
}

input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();handleSend()}});

function forceStopAudio(){if("speechSynthesis"in window)speechSynthesis.cancel()}
function stopMic(){clearTimeout(speechDebounceTimer);speechDebounceTimer=null;if(recognition&&isRecording)try{recognition.abort()}catch(_){}isRecording=false;micBtn.classList.remove("listening");micBtn.innerText="🎙️"}

function toggleVoiceInput(){
 forceStopAudio();if(isRecording){stopMic();statusText.innerText="तैयार हूँ";return}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("ब्राउज़र वॉइस इनपुट का समर्थन नहीं करता।");return}
 recognition=new SR();recognition.lang="hi-IN";recognition.continuous=false;recognition.interimResults=true;
 recognition.onstart=()=>{isRecording=true;micBtn.classList.add("listening");micBtn.innerText="⏹️";statusText.innerText="सुन रही हूँ..."};
 recognition.onresult=e=>{let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;t=t.trim();if(t){input.value=t;clearTimeout(speechDebounceTimer);speechDebounceTimer=setTimeout(()=>{stopMic();handleSend()},1600)}};
 recognition.onerror=()=>{stopMic();statusText.innerText="तैयार हूँ"};
 recognition.onend=()=>{if(isRecording&&input.value.trim()){clearTimeout(speechDebounceTimer);speechDebounceTimer=setTimeout(()=>{stopMic();handleSend()},1000)}else{stopMic();if(!isBusy)statusText.innerText="तैयार हूँ"}};
 try{recognition.start()}catch(_){stopMic()}
}

function speakMsg(t){
 if(!("speechSynthesis"in window))return;forceStopAudio();statusText.innerText="बोल रही हूँ...";
 const clean=t.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,"").replace(/[\(\)\\\/\#\*\_\|\`📌📍👉✓•\-\+]/g," ").replace(/कॉपी|सेव|सुनो|एडिट|दोबारा/gi,"").trim(),u=new SpeechSynthesisUtterance(clean);
 u.lang="hi-IN";u.rate=1;u.pitch=1.05;u.onend=()=>{if(!isBusy)statusText.innerText="तैयार हूँ"};u.onerror=u.onend;speechSynthesis.speak(u)
}
</script>
<script>
(()=>{["ui.js","features.js"].forEach(f=>{let s=document.createElement("script");s.src=f+"?v="+Date.now();s.defer=true;document.body.appendChild(s)})})()
</script>
</body>
  </html>
